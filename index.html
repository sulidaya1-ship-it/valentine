<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine?</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff5f7}
    .card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12);width:min(520px,92vw);text-align:center}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 18px;opacity:.85}
    .buttons{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
    button{border:0;border-radius:14px;padding:14px 18px;font-size:18px;cursor:pointer;transition:transform .12s ease,opacity .12s ease}
    #yes{background:#ff2d55;color:#fff;transform:scale(1)}
    #no{background:#f1f2f4;color:#222;transform:scale(1)}
    .result{margin-top:18px;font-size:18px;display:none}
    .emoji{font-size:40px;margin:12px 0 0}
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="buttons" id="btnRow">
      <button id="yes">Yes 😍</button>
      <button id="no">No 🙃</button>
    </div>

    <div class="result" id="result">
      <div class="emoji">🥰🌹</div>
      <div><strong>YAY!</strong> It’s a date. I’m picking you up. 💐</div>
    </div>
  </div>

  <script>
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const result = document.getElementById("result");
    const btnRow = document.getElementById("btnRow");

    let yesScale = 1, noScale = 1;
    const MIN_NO_SCALE = 0.45;
    const MAX_YES_SCALE = 2.6;

    function applyScales(){
      yes.style.transform = `scale(${yesScale})`;
      no.style.transform  = `scale(${noScale})`;
      no.style.opacity = Math.max(0.55, noScale);
    }

    no.addEventListener("click", () => {
      yesScale = Math.min(MAX_YES_SCALE, yesScale + 0.18);
      noScale  = Math.max(MIN_NO_SCALE, noScale - 0.12);
      applyScales();
    });

    yes.addEventListener("click", () => {
      btnRow.style.display = "none";
      result.style.display = "block";
    });

    applyScales();
  </script>
</body>
</html>
